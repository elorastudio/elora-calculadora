<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉLORA studio · Calculadora</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f2f4;
  color: #40363a;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 680px;
  margin: auto;
  padding: 22px 16px 40px;
}

.brand {
  text-align: center;
}

.brand h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 32px;
  letter-spacing: 2px;
}

.brand p {
  margin: 5px 0 22px;
  font-size: 12px;
  letter-spacing: .5px;
}

.card {
  background: white;
  border: 1px solid #eadfe3;
  border-radius: 18px;
  padding: 18px;
  margin: 12px 0;
  box-shadow: 0 5px 18px rgba(0,0,0,.04);
}

h2 {
  font-family: Georgia, serif;
  font-size: 18px;
  margin: 0 0 14px;
}

label {
  display: block;
  font-size: 13px;
  margin: 10px 0 6px;
}

select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d9cbd0;
  border-radius: 12px;
  background: white;
  color: #40363a;
  font: inherit;
}

.hidden {
  display: none !important;
}

/* LARGOS */

.lengths {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.length {
  border: 1px solid #d9cbd0;
  background: white;
  border-radius: 12px;
  padding: 12px;
  text-align: left;
  color: #40363a;
}

.length.active {
  border-color: #8f6f7b;
  background: #f3e9ed;
}

.length b {
  display: block;
  margin-bottom: 3px;
}

.muted {
  font-size: 11px;
  color: #81757a;
}

/* EFECTOS Y EXTRAS */

.effect {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 1px solid #eee5e8;
}

.effect:last-child {
  border-bottom: none;
}

.name {
  flex: 1;
  font-size: 13px;
}

.qty {
  display: flex;
  align-items: center;
  gap: 7px;
}

.qty button {
  width: 30px;
  height: 30px;
  border: 1px solid #d9cbd0;
  border-radius: 50%;
  background: white;
  color: #40363a;
  font-size: 17px;
}

.qty span {
  min-width: 20px;
  text-align: center;
  font-size: 13px;
}

/* RESUMEN */

.summary {
  font-size: 14px;
  line-height: 1.7;
}

.total {
  font-size: 25px;
  font-weight: bold;
  text-align: center;
  margin: 15px 0;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.primary,
.secondary {
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font: inherit;
}

.primary {
  background: #765966;
  color: white;
}

.secondary {
  background: #eee5e8;
  color: #4d4146;
}

.note {
  text-align: center;
  font-size: 11px;
  color: #81757a;
  line-height: 1.5;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="app">

<header class="brand">
  <h1>ÉLORA studio</h1>
  <p>Dónde el cuidado se convierte en arte</p>
</header>


<!-- SERVICIO -->

<section class="card">

<h2>Servicio</h2>

<select id="service">

  <option value="acrylic">
    Set nuevo de acrílico
  </option>

  <option value="retouch">
    Retoque de acrílico
  </option>

  <option value="gel">
    Gel semipermanente
  </option>

  <option value="rubber">
    Rubber gel
  </option>

  <option value="bath">
    Baño de acrílico
  </option>

  <option value="acripie">
    Acripié
  </option>

</select>


<div id="gelBox" class="hidden">

<label>Modalidad</label>

<select id="gelType">

  <option value="hands">
    Manos — $300
  </option>

  <option value="feet">
    Pies — $300
  </option>

  <option value="maniSpa">
    Mani spa — $400
  </option>

  <option value="pediSpa">
    Pedi spa — $400
  </option>

</select>

</div>

</section>


<!-- LARGO -->

<section id="lengthCard" class="card">

<h2>Largo</h2>

<div id="lengths" class="lengths"></div>

</section>


<!-- EFECTOS -->

<section id="effectsCard" class="card">

<h2>
Diseños y efectos
<span class="muted">· por uña</span>
</h2>

<div id="effects"></div>

</section>


<!-- EXTRAS -->

<section class="card">

<h2>Extras</h2>

<div id="extras"></div>

</section>


<!-- RESUMEN -->

<section class="card">

<h2>Resumen</h2>

<div id="summary" class="summary"></div>

<div id="total" class="total">
$0
</div>

<div class="actions">

<button class="primary" id="share">
Compartir
</button>

<button class="secondary" id="reset">
Reiniciar
</button>

</div>

</section>


<p class="note">
Nuestros servicios incluyen uno o dos tonos lisos de gel semipermanente.
</p>

</div>


<script>

/* =====================================================
   PRECIOS DEFINITIVOS ÉLORA
===================================================== */

const defaultPrices = {

  /* LARGOS */

  length: [
    400,
    450,
    500,
    550,
    600
  ],

  /* GEL */

  gel: [
    300,
    300,
    400,
    400
  ],

  /* SERVICIOS */

  rubber: 350,

  bath: 350,

  acripie: 500,

  /* EXTRAS */

  extension: 50,

  removeGel: 50,

  removeAcrylic: 100,

  removeOther: 150,

  /* EFECTOS */

  effects: [

    10, // Ojo de gato
    10, // Espejo
    10, // Aurora
    10, // Azúcar
    10, // Sweater
    10, // Perla
    5,  // Glitter
    15, // Carey
    10, // Blooming
    15, // Aura
    15, // Baby boomer
    10, // Relieve
    15, // Alto relieve
    25, // Flor 3D
    5,  // Francés
    5,  // Nail art simple
    15, // Nail art medio
    30, // Nail art medio alto
    10, // Encapsulado
    10, // Naturaleza muerta
    25, // Dijes
    5,  // Sticker
    20, // Cristales CH
    30, // Cristales M
    40, // Cristales G
    20, // Uña completa cristal L1-2
    35, // Uña completa cristal L3-4
    50  // Uña completa cristal L5-6

  ]

};


/* =====================================================
   NOMBRES DE EFECTOS
===================================================== */

const effectNames = [

  "Ojo de gato",
  "Espejo",
  "Aurora",
  "Azúcar",
  "Sweater",
  "Perla",
  "Glitter",
  "Carey",
  "Blooming",
  "Aura",
  "Baby boomer",
  "Relieve",
  "Alto relieve",
  "Flor 3D",
  "Francés",
  "Nail art simple",
  "Nail art medio",
  "Nail art medio alto",
  "Encapsulado",
  "Naturaleza muerta",
  "Dijes",
  "Sticker",
  "Diseño cristales CH",
  "Diseño cristales M",
  "Diseño cristales G",
  "Uña completa cristal (largo 1-2)",
  "Uña completa cristal (largo 3-4)",
  "Uña completa cristal (largo 5-6)"

];


/* =====================================================
   PRECIOS EDITABLES
===================================================== */

let prices =
  JSON.parse(localStorage.getItem("eloraPrices")) ||
  JSON.parse(JSON.stringify(defaultPrices));


/* =====================================================
   ESTADO
===================================================== */

let selectedLength = 0;

let effectCounts =
  new Array(effectNames.length).fill(0);

let extras = {

  extension: 0,

  removeGel: 0,

  removeAcrylic: 0,

  removeOther: 0

};


/* =====================================================
   ELEMENTOS
===================================================== */

const service =
  document.getElementById("service");

const gelBox =
  document.getElementById("gelBox");

const gelType =
  document.getElementById("gelType");

const lengthCard =
  document.getElementById("lengthCard");

const effectsCard =
  document.getElementById("effectsCard");

const lengths =
  document.getElementById("lengths");

const effects =
  document.getElementById("effects");

const extrasContainer =
  document.getElementById("extras");

const summary =
  document.getElementById("summary");

const totalElement =
  document.getElementById("total");

const shareButton =
  document.getElementById("share");

const resetButton =
  document.getElementById("reset");


/* =====================================================
   FORMATO DE DINERO
===================================================== */

function money(value) {

  return "$" +
    value.toLocaleString("es-MX");

}


/* =====================================================
   RENDER LARGOS
===================================================== */

function renderLengths() {

  lengths.innerHTML =
    prices.length.map((price, index) => {

      return `

        <button
          class="length ${index === selectedLength ? "active" : ""}"
          onclick="setLength(${index})"
        >

          <b>
            Largo ${index + 1}
          </b>

          <span>
            ${money(price)}
          </span>

        </button>

      `;

    }).join("");

}


function setLength(index) {

  selectedLength = index;

  renderLengths();

  calculate();

}


/* =====================================================
   RENDER EFECTOS
===================================================== */

function renderEffects() {

  effects.innerHTML =
    effectNames.map((name, index) => {

      return `

        <div class="effect">

          <span class="name">

            ${name}

            <br>

            <span class="muted">

              ${money(prices.effects[index])}
              / uña

            </span>

          </span>


          <div class="qty">

            <button
              onclick="changeEffect(${index}, -1)"
            >
              −
            </button>

            <span>
              ${effectCounts[index]}
            </span>

            <button
              onclick="changeEffect(${index}, 1)"
            >
              +
            </button>

          </div>

        </div>

      `;

    }).join("");

}


function changeEffect(index, amount) {

  effectCounts[index] =
    Math.max(
      0,
      effectCounts[index] + amount
    );

  renderEffects();

  calculate();

}


/* =====================================================
   EXTRAS
===================================================== */

const extraNames = {

  extension:
    "Extensión de uña",

  removeGel:
    "Retiro de gel",

  removeAcrylic:
    "Retiro de acrílico",

  removeOther:
    "Retiro de otro salón"

};


function renderExtras() {

  extrasContainer.innerHTML =
    Object.keys(extraNames).map(key => {

      return `

        <div class="effect">

          <span class="name">

            ${extraNames[key]}

            <br>

            <span class="muted">

              ${money(prices[key])}
              / unidad

            </span>

          </span>


          <div class="qty">

            <button
              onclick="changeExtra('${key}', -1)"
            >
              −
            </button>

            <span>
              ${extras[key]}
            </span>

            <button
              onclick="changeExtra('${key}', 1)"
            >
              +
            </button>

          </div>

        </div>

      `;

    }).join("");

}


function changeExtra(key, amount) {

  extras[key] =
    Math.max(
      0,
      extras[key] + amount
    );

  renderExtras();

  calculate();

}


/* =====================================================
   PRECIO BASE
===================================================== */

function getBasePrice() {

  const selected =
    service.value;


  if (
    selected === "acrylic" ||
    selected === "retouch"
  ) {

    return prices.length[selectedLength];

  }


  if (selected === "gel") {

    return prices.gel[
      gelType.selectedIndex
    ];

  }


  return prices[selected];

}


/* =====================================================
   CÁLCULO TOTAL
===================================================== */

function calculate() {

  const base =
    getBasePrice();


  let effectsTotal = 0;


  effectCounts.forEach(
    (count, index) => {

      effectsTotal +=
        count *
        prices.effects[index];

    }
  );


  let extrasTotal = 0;


  Object.keys(extras).forEach(key => {

    extrasTotal +=
      extras[key] *
      prices[key];

  });


  const total =
    base +
    effectsTotal +
    extrasTotal;


  let lines = [];


  lines.push(
    service.options[
      service.selectedIndex
    ].text +
    ": " +
    money(base)
  );


  if (
    service.value === "acrylic" ||
    service.value === "retouch"
  ) {

    lines[0] +=
      " · Largo " +
      (selectedLength + 1);

  }


  effectCounts.forEach(
    (count, index) => {

      if (count > 0) {

        lines.push(

          effectNames[index] +
          " × " +
          count +
          ": " +
          money(
            count *
            prices.effects[index]
          )

        );

      }

    }
  );


  Object.keys(extras).forEach(key => {

    if (extras[key] > 0) {

      lines.push(

        extraNames[key] +
        " × " +
        extras[key] +
        ": " +
        money(
          extras[key] *
          prices[key]
        )

      );

    }

  });


  summary.innerHTML =
    lines.join("<br>");


  totalElement.textContent =
    money(total);


  return total;

}


/* =====================================================
   MOSTRAR / OCULTAR SECCIONES
===================================================== */

function updateSections() {

  const selected =
    service.value;


  const isAcrylic =
    selected === "acrylic" ||
    selected === "retouch";


  lengthCard.classList.toggle(
    "hidden",
    !isAcrylic
  );


  effectsCard.classList.toggle(
    "hidden",
    !isAcrylic
  );


  gelBox.classList.toggle(
    "hidden",
    selected !== "gel"
  );


  calculate();

}


/* =====================================================
   EVENTOS
===================================================== */

service.addEventListener(
  "change",
  updateSections
);


gelType.addEventListener(
  "change",
  calculate
);


/* =====================================================
   COMPARTIR
===================================================== */

shareButton.addEventListener(
  "click",
  async () => {

    const text =

      "ÉLORA studio\n\n" +

      summary.innerText +

      "\n\nTotal: " +

      totalElement.innerText;


    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            "ÉLORA studio",

          text:
            text

        });

      } catch (error) {}

      return;

    }


    try {

      await navigator.clipboard.writeText(
        text
      );


      shareButton.textContent =
        "¡Copiado!";


      setTimeout(() => {

        shareButton.textContent =
          "Compartir";

      }, 1500);


    } catch (error) {

      alert(text);

    }

  }
);


/* =====================================================
   REINICIAR
===================================================== */

resetButton.addEventListener(
  "click",
  () => {

    selectedLength = 0;

    effectCounts.fill(0);


    Object.keys(extras).forEach(
      key => {

        extras[key] = 0;

      }
    );


    service.value =
      "acrylic";


    renderLengths();

    renderEffects();

    renderExtras();

    updateSections();

  }
);


/* =====================================================
   INICIAR
===================================================== */

renderLengths();

renderEffects();

renderExtras();

updateSections();

</script>

</body>
</html>
